name: "Bug: CustomPerm"
description: Report a bug in CustomPerm
title: "[CustomPerm] "
labels: ["bug", "mod: CustomPerm"]
body:
  - type: input
    id: mod-version
    attributes:
      label: Mod version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: mc-version
    attributes:
      label: Minecraft version
      options:
        - "1.21.1"
    validations:
      required: true

  - type: dropdown
    id: loader
    attributes:
      label: Loader
      options:
        - NeoForge
    validations:
      required: true

  - type: input
    id: loader-version
    attributes:
      label: Loader version
      placeholder: "21.1.x"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happens, and what should happen instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: input
    id: logs
    attributes:
      label: Log or crash report
      description: Upload your file to https://mclo.gs and paste the link here.
    validations:
      required: true

  - type: textarea
    id: other-mods
    attributes:
      label: Other installed mods
      description: List of mods, or a link to the modpack.

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked that this bug has not already been reported.
          required: true
        - label: I am using the latest version of the mod.
          required: true
